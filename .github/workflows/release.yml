name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check version
        run: |
          version=$(node -p "require('./manifest.json').version")
          package_version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$version" || "$package_version" != "$version" ]]; then
            echo "::error::The tag, manifest.json and package.json must use the same version."
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run package
      - run: npm run lint
      - name: Sign for Firefox
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          git archive --format=zip --output=artifacts/twi-replay-source.zip HEAD
          npm exec -- web-ext sign --channel unlisted --source-dir dist \
            --artifacts-dir artifacts/signed --upload-source-code artifacts/twi-replay-source.zip
          mv artifacts/signed/*.xpi "artifacts/twi-replay-${GITHUB_REF_NAME#v}.xpi"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="artifacts/twi-replay-${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "$base.zip" "$base.xpi" --verify-tag --generate-notes
